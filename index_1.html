<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KPI Karte">
<title>KPI Karte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e6b63'/><g fill='none' stroke='white' stroke-width='11' stroke-linecap='round'><path d='M50 18a32 32 0 1 1-22.6 9.4'/></g><circle cx='50' cy='50' r='7' fill='white'/></svg>">
<style>
:root{
  color-scheme: light;
  --bg:#f5f7f6; --surface:#ffffff; --surface-2:#eef2f1; --surface-3:#e6ecea;
  --ink:#141a19; --ink-2:#4d5a57; --ink-3:#7e8b88;
  --line:#e0e7e5; --line-strong:#c8d3d0;
  --accent:#0e6b63; --accent-ink:#0a544e; --accent-soft:#d9ecea;
  --good:#0a8f2c; --good-soft:#dcf0e0; --danger:#c33b3b;
  --shadow:0 1px 2px rgba(16,32,29,.05), 0 6px 18px -12px rgba(16,32,29,.28);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --grid:#e1e6e4; --axis:#c3ccc9; --muted:#8a9693;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c100f; --surface:#151b1a; --surface-2:#1c2322; --surface-3:#242c2b;
    --ink:#f0f4f3; --ink-2:#a8b4b1; --ink-3:#7b8785;
    --line:#242c2b; --line-strong:#33403d;
    --accent:#43b9ab; --accent-ink:#6fd0c3; --accent-soft:#16302d;
    --good:#22b34a; --good-soft:#122c1a; --danger:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --grid:#232b2a; --axis:#36403e; --muted:#8a9693;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c100f; --surface:#151b1a; --surface-2:#1c2322; --surface-3:#242c2b;
  --ink:#f0f4f3; --ink-2:#a8b4b1; --ink-3:#7b8785;
  --line:#242c2b; --line-strong:#33403d;
  --accent:#43b9ab; --accent-ink:#6fd0c3; --accent-soft:#16302d;
  --good:#22b34a; --good-soft:#122c1a; --danger:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --grid:#232b2a; --axis:#36403e; --muted:#8a9693;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:"Archivo", system-ui, sans-serif; font-weight:700; margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
img{max-width:100%}
[hidden]{display:none !important}

.wrap{max-width:1080px; margin:0 auto; padding:0 16px 96px}
header.top{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.topbar{max-width:1080px; margin:0 auto; padding:10px 16px 0; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:baseline; gap:8px; margin-right:auto; min-width:0}
.brand b{font-family:"Archivo",sans-serif; font-weight:800; font-size:16px; letter-spacing:-.01em}
.brand span{font-size:11px; color:var(--ink-3); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap}
.iconbtn{width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.iconbtn svg{width:18px; height:18px}
.weeknav{max-width:460px; margin:0 auto; padding:10px 16px 12px; display:flex; align-items:center; gap:10px}
.navbtn{width:40px; height:40px; flex:0 0 auto; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2); display:grid; place-items:center}
.navbtn:hover{background:var(--surface-2); color:var(--ink)}
.navbtn svg{width:16px;height:16px}
.weeklabel{flex:1 1 auto; text-align:center; min-width:0}
.weeklabel .kw{font-family:"Archivo",sans-serif; font-weight:700; font-size:19px; letter-spacing:-.01em; display:block}
.weeklabel .sub{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:2px}
.weeklabel .range{font-size:12px; color:var(--ink-3); white-space:nowrap}
.today-chip{height:22px; padding:0 9px; border-radius:99px; font-size:11.5px; font-weight:500;
  border:1px solid var(--accent); color:var(--accent-ink); background:var(--accent-soft); white-space:nowrap; flex:0 0 auto}
.tabs{max-width:460px; margin:0 auto; padding:0 16px 10px; display:flex; gap:4px}
.tab{flex:1; height:36px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--ink-2); border:1px solid transparent}
.tab[aria-selected="true"]{background:var(--surface); border-color:var(--line); color:var(--ink); font-weight:600; box-shadow:var(--shadow)}
.tab:hover[aria-selected="false"]{color:var(--ink); background:var(--surface-2)}

.areas{display:grid; gap:14px; margin-top:16px}
@media(min-width:820px){ .areas{grid-template-columns:1fr 1fr} }
.area{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.area-head{display:flex; align-items:center; gap:10px; padding:13px 15px 11px; border-bottom:1px solid var(--line)}
.area-head h2{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); font-weight:700}
.area-score{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-3)}
.area-score b{font-weight:600; color:var(--ink-2)}
.metric{padding:12px 15px 13px; border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:none}
.metric.done{background:linear-gradient(90deg, var(--good-soft), transparent 70%)}
.m-top{display:flex; align-items:center; gap:10px}
.m-name{min-width:0; flex:1 1 auto}
.m-name .n{display:block; font-weight:600; font-size:14.5px; letter-spacing:-.005em}
.m-name .h{display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px}
.stepper{display:flex; align-items:center; gap:4px; flex:0 0 auto}
.step{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink-2); display:grid; place-items:center; font-family:"Archivo",sans-serif; font-size:19px;
  font-weight:600; line-height:1; -webkit-user-select:none; user-select:none}
.step:hover{background:var(--surface-3); color:var(--ink)}
.step:active{transform:translateY(1px)}
.step.minus:disabled{opacity:.3; cursor:default; transform:none}
.val{width:62px; height:38px; text-align:center; border:1px solid transparent; border-radius:9px;
  background:transparent; font-family:"Archivo",sans-serif; font-weight:700; font-size:17px;
  font-variant-numeric:tabular-nums; padding:0 2px}
.val:hover{border-color:var(--line)}
.val:focus{border-color:var(--accent); background:var(--surface-2); outline:none}
.notebtn{width:34px; height:38px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-3); display:grid; place-items:center; flex:0 0 auto}
.notebtn svg{width:16px; height:16px}
.notebtn:hover{color:var(--ink); background:var(--surface-3)}
.notebtn.has{color:var(--accent-ink); background:var(--accent-soft); border-color:var(--accent)}
.notepanel{margin-top:10px}
.noteinput{width:100%; min-height:66px; border:1px solid var(--line); border-radius:10px; padding:9px 10px;
  background:var(--surface-2); font-size:13.5px; line-height:1.5; resize:vertical; font-family:inherit}
.noteinput:focus{border-color:var(--accent); outline:none; background:var(--surface)}
@media(max-width:410px){ .step{width:35px} .val{width:50px} .stepper{gap:3px} }
.m-bar{display:flex; align-items:center; gap:9px; margin-top:9px}
.track{position:relative; flex:1 1 auto; height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden}
.fill{position:absolute; inset:0 auto 0 0; border-radius:99px; background:var(--accent); transition:width .22s ease}
.metric.done .fill{background:var(--good)}
.goal{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.goal b{color:var(--ink-2); font-weight:600}

.hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:26px 20px 24px; margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:6px}
.hero .cap{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.hero .sub{font-size:13px; color:var(--ink-2); text-align:center; max-width:44ch}
.ringgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:14px}
.ringcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
.ringcard .nm{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); font-weight:700}
.ringcard .dt{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.openlist{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  margin-top:14px; overflow:hidden}
.openlist h3{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2);
  padding:13px 15px 11px; border-bottom:1px solid var(--line)}
.openrow{display:flex; align-items:center; gap:10px; padding:10px 15px; border-bottom:1px solid var(--line); font-size:14px}
.openrow:last-child{border-bottom:none}
.openrow .rest{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600; color:var(--ink)}
.openrow.ok{color:var(--ink-3)}
.openrow.ok .rest{color:var(--good)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--accent);flex:0 0 auto}
.openrow.ok .dot{background:var(--good)}
.empty{padding:26px 18px; text-align:center; color:var(--ink-3); font-size:13.5px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  margin-top:16px; overflow:hidden}
.filters{display:flex; flex-wrap:wrap; gap:6px; padding:13px 15px; border-bottom:1px solid var(--line)}
.chip{height:30px; padding:0 11px; border-radius:99px; font-size:12.5px; font-weight:500;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2)}
.chip:hover{background:var(--surface-3); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.chip .sw{display:inline-block; width:9px; height:9px; border-radius:99px; margin-right:6px; vertical-align:-1px}
.chartwrap{padding:16px 8px 6px}
.legend{display:flex; flex-wrap:wrap; gap:14px; padding:2px 16px 15px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:3px; border-radius:2px; display:inline-block}
.tip{position:absolute; pointer-events:none; z-index:5; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:10px; box-shadow:var(--shadow); padding:8px 10px; font-size:12.5px; min-width:110px; opacity:0; transition:opacity .1s}
.tip .tw{font-weight:700; font-family:"Archivo",sans-serif; margin-bottom:4px; font-size:12.5px}
.tip .tr{display:flex; align-items:center; gap:7px; white-space:nowrap; line-height:1.6}
.tip .tr i{width:9px;height:9px;border-radius:99px;flex:0 0 auto}
.tip .tr b{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600}

.sheet{position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; padding:0 0 60px}
.sheet-top{position:sticky; top:0; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); z-index:2; padding-top:env(safe-area-inset-top)}
.sheet-top .row{max-width:1080px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px}
.sheet-top h2{font-size:17px; letter-spacing:-.01em}
.sheet-body{max-width:1080px; margin:0 auto; padding:0 16px}
.setgroup{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  margin-top:14px; overflow:hidden}
.setgroup-head{padding:11px 14px; border-bottom:1px solid var(--line); font-family:"Archivo",sans-serif; font-weight:700;
  font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.setrow{padding:11px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.setrow:last-of-type{border-bottom:none}
.setrow .sname{flex:1 1 150px; min-width:0; font-weight:600; font-size:14px}
.setrow .sname small{display:block; font-weight:400; font-size:11.5px; color:var(--ink-3)}
.f{display:flex; align-items:center; gap:6px}
.f label{font-size:11px; color:var(--ink-3); letter-spacing:.04em}
.tin{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:7px 9px; font-size:14px; min-width:0}
.tin:focus{border-color:var(--accent); outline:none}
.tin.name{flex:1 1 140px; font-weight:600}
.tin.num{width:72px; text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.tin.sel{padding:7px 6px}
.mini{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink-3); display:grid; place-items:center; flex:0 0 auto}
.mini:hover{color:var(--ink); background:var(--surface-3)}
.mini.danger:hover{color:var(--danger); border-color:var(--danger)}
.mini svg{width:14px;height:14px}
.addrow{padding:10px 14px}
.addbtn{height:34px; padding:0 12px; border-radius:9px; border:1px dashed var(--line-strong); color:var(--ink-2);
  font-size:13px; font-weight:500; width:100%}
.addbtn:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.bigbtn{height:42px; padding:0 16px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
  font-size:14px; font-weight:600; box-shadow:var(--shadow); display:inline-flex; align-items:center; gap:8px}
.bigbtn:hover{border-color:var(--accent); color:var(--accent-ink)}
.bigbtn svg{width:16px;height:16px}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; padding:14px}
.note{font-size:12.5px; color:var(--ink-3); padding:14px 2px 0; max-width:64ch; line-height:1.6}
.savebadge{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:60; background:var(--ink);
  color:var(--bg); font-size:12.5px; font-weight:500; padding:8px 14px; border-radius:99px; opacity:0;
  transition:opacity .25s; pointer-events:none}
.savebadge.show{opacity:.92}
.infobox{display:flex; gap:9px; align-items:flex-start; margin-top:16px; padding:12px 14px; border:1px solid var(--line);
  border-radius:11px; background:var(--surface-2); font-size:12.5px; color:var(--ink-2); line-height:1.55}
.infobox b{color:var(--ink)}
.infobox.accent{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>

<header class="top">
  <div class="topbar">
    <div class="brand"><b>KPI Karte</b><span id="storemode"></span></div>
    <button class="iconbtn" id="openset" aria-label="Ziele und Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 21V14M5 10V3M12 21V12M12 8V3M19 21V16M19 12V3"/><path d="M2.5 14h5M9.5 8h5M16.5 16h5"/></svg>
    </button>
  </div>
  <div class="weeknav">
    <button class="navbtn" id="prevw" aria-label="Woche zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="weeklabel">
      <span class="kw" id="kwlabel">KW –</span>
      <span class="sub"><span class="range" id="kwrange"></span><button class="today-chip" id="gotoday" hidden>Heute</button></span>
    </div>
    <button class="navbtn" id="nextw" aria-label="Woche vor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="week" aria-selected="true">Woche</button>
    <button class="tab" role="tab" data-view="progress" aria-selected="false">Fortschritt</button>
    <button class="tab" role="tab" data-view="history" aria-selected="false">Verlauf</button>
  </div>
</header>

<main class="wrap">
  <section id="view-week"></section>
  <section id="view-progress" hidden></section>
  <section id="view-history" hidden></section>
  <div class="infobox accent" id="updnote" hidden></div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-top"><div class="row">
    <h2>Ziele &amp; Einstellungen</h2>
    <button class="iconbtn" id="closeset" style="margin-left:auto" aria-label="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div></div>
  <div class="sheet-body" id="setbody"></div>
</div>

<input type="file" id="importfile" accept="application/json,.json" hidden>
<div class="savebadge" id="savebadge">Gespeichert</div>

<script>
(function(){
"use strict";

/* ============================================================
   KPI Karte – eigenständige Version
   Alle Daten liegen im Browser des jeweiligen Geräts.
   Kennzahlen kommen aus STANDARD (unten); jeder Nutzer setzt
   nur seine Ziele. Neue Programmversion = Datei austauschen,
   gespeicherte Zahlen und Ziele bleiben erhalten.
   ============================================================ */
const APP_VERSION = "1.1";
const CONFIG_VERSION = 1;      // bei Änderungen an STANDARD um 1 erhöhen

const STANDARD = {
  areas:[
    {id:"a_partner",  name:"Partneraufbau"},
    {id:"a_netz",     name:"Netzwerken"},
    {id:"a_telefon",  name:"Telefonie"},
    {id:"a_kunden",   name:"Kunden"},
    {id:"a_entw",     name:"Entwicklung"}
  ],
  metrics:[
    {id:"m_popa",    area:"a_partner", name:"PoPa Treffen",   hint:"",                        goal:10, unit:"n", step:1},
    {id:"m_peoa",    area:"a_partner", name:"Partner EoA",    hint:"",                        goal:1,  unit:"n", step:1},
    {id:"m_events",  area:"a_netz",    name:"Events",         hint:"",                        goal:1,  unit:"n", step:1},
    {id:"m_platt",   area:"a_netz",    name:"Plattformen",    hint:"",                        goal:5,  unit:"n", step:1},
    {id:"m_neu",     area:"a_netz",    name:"Neukontakte",    hint:"",                        goal:5,  unit:"n", step:1},
    {id:"m_outings", area:"a_netz",    name:"Outings",        hint:"Was ich beruflich mache", goal:3,  unit:"n", step:1},
    {id:"m_tzeit",   area:"a_telefon", name:"Telefonierzeit", hint:"in Stunden",              goal:5,  unit:"h", step:0.5},
    {id:"m_warmup",  area:"a_telefon", name:"Warm Up Calls",  hint:"",                        goal:10, unit:"n", step:1},
    {id:"m_kaffee",  area:"a_kunden",  name:"Kaffeetreffen",  hint:"mit potentiellen Kunden", goal:3,  unit:"n", step:1},
    {id:"m_keoa",    area:"a_kunden",  name:"Kunden EoA",     hint:"",                        goal:3,  unit:"n", step:1},
    {id:"m_t1",      area:"a_kunden",  name:"T1",             hint:"Ersttermine",             goal:1,  unit:"n", step:1},
    {id:"m_ausb",    area:"a_entw",    name:"Ausbildung",     hint:"in Thema einarbeiten",    goal:1,  unit:"n", step:1}
  ]
};

/* ---------- Speicher (nur dieses Gerät) ---------- */
const K = {ov:"kpi.overrides", cm:"kpi.custom", cfgv:"kpi.cfgversion", week:k=>"kpi.week."+k};
function lsGet(k, fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

let overrides = lsGet(K.ov, {}) || {};      // {metricId:{goal, step}}
let custom    = lsGet(K.cm, []) || [];      // eigene Kennzahlen
let config    = buildConfig();

function buildConfig(){
  const metrics = STANDARD.metrics.map(m=>{
    const o = overrides[m.id] || {};
    return Object.assign({}, m, {
      goal: (typeof o.goal === "number") ? o.goal : m.goal,
      step: (typeof o.step === "number") ? o.step : m.step,
      std: true
    });
  });
  custom.forEach(c=>{
    if(!STANDARD.areas.some(a=>a.id===c.area)) return;
    metrics.push(Object.assign({}, c, {std:false}));
  });
  return {areas: STANDARD.areas.slice(), metrics};
}
function persistConfig(){
  lsSet(K.ov, overrides); lsSet(K.cm, custom);
  config = buildConfig();
  flashSaved();
}

/* ---------- Kalenderwochen (ISO 8601) ---------- */
function isoOf(d){
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = (t.getUTCDay()+6)%7;
  t.setUTCDate(t.getUTCDate()-day+3);
  const year = t.getUTCFullYear();
  const first = new Date(Date.UTC(year,0,4));
  first.setUTCDate(first.getUTCDate()-((first.getUTCDay()+6)%7)+3);
  return {year, week: 1 + Math.round((t-first)/604800000)};
}
function mondayOf(year, week){
  const jan4 = new Date(Date.UTC(year,0,4));
  const m = new Date(jan4);
  m.setUTCDate(jan4.getUTCDate()-((jan4.getUTCDay()+6)%7)+(week-1)*7);
  return m;
}
function keyOf(mon){ const {year,week}=isoOf(mon); return year+"-W"+String(week).padStart(2,"0"); }
function shiftWeek(mon, n){ const d=new Date(mon); d.setUTCDate(d.getUTCDate()+n*7); return d; }
function todayMonday(){
  const now = new Date();
  const t = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));
  return t;
}
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function rangeLabel(mon){
  const end = new Date(mon); end.setUTCDate(end.getUTCDate()+6);
  const a = mon.getUTCDate(), b = end.getUTCDate();
  const ma = MON[mon.getUTCMonth()], mb = MON[end.getUTCMonth()];
  return ma===mb ? `${a}.–${b}. ${mb} ${end.getUTCFullYear()}` : `${a}. ${ma} – ${b}. ${mb} ${end.getUTCFullYear()}`;
}

/* ---------- Formatierung ---------- */
function fmt(v, unit){
  if(unit==="h"){ return v.toLocaleString("de-DE",{minimumFractionDigits:(v%1?1:0), maximumFractionDigits:2})+" h"; }
  if(unit==="eur") return Math.round(v).toLocaleString("de-DE")+" €";
  return String(Math.round(v*100)/100).replace(".",",");
}
function parseNum(s){
  const n = parseFloat(String(s).replace(/\s/g,"").replace(",","."));
  return isFinite(n) ? Math.max(0,n) : 0;
}
function round2(n){ return Math.round(n*100)/100; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Zustand ---------- */
let curMon = todayMonday();
const weekCache = new Map();
let view = "week";
let hSeries = ["__total"];
let hRange = 12;
const openNotes = new Set();

function loadWeek(key){
  if(!weekCache.has(key)) weekCache.set(key, lsGet(K.week(key), {values:{}, notes:{}}) || {values:{}, notes:{}});
  return weekCache.get(key);
}
function valuesOf(key){ const w = weekCache.get(key); return (w && w.values) ? w.values : {}; }
function notesOf(key){ const w = weekCache.get(key); return (w && w.notes) ? w.notes : {}; }
function getVal(mid){ return valuesOf(keyOf(curMon))[mid] || 0; }

const badge = document.getElementById("savebadge");
let badgeT = null;
function showBadge(text, danger){
  badge.textContent = text;
  badge.style.background = danger ? "#c33b3b" : "";
  badge.style.color = danger ? "#fff" : "";
  badge.classList.add("show");
  clearTimeout(badgeT);
  badgeT = setTimeout(()=>badge.classList.remove("show"), danger?2600:1100);
}
function flashSaved(){ showBadge("Gespeichert", false); }

function writeWeek(key, w){
  weekCache.set(key, w);
  if(!lsSet(K.week(key), w)) showBadge("Speicher voll – bitte Daten sichern", true);
  else flashSaved();
}
function setVal(mid, v){
  const key = keyOf(curMon); const w = loadWeek(key);
  const values = Object.assign({}, w.values||{});
  values[mid] = Math.max(0, round2(v));
  writeWeek(key, {values, notes: Object.assign({}, w.notes||{}), updatedAt:new Date().toISOString()});
}
function setNote(mid, text){
  const key = keyOf(curMon); const w = loadWeek(key);
  const notes = Object.assign({}, w.notes||{});
  const t = String(text||"").slice(0,4000);
  if(t.trim()) notes[mid] = t; else delete notes[mid];
  writeWeek(key, {values: Object.assign({}, w.values||{}), notes, updatedAt:new Date().toISOString()});
}

/* ---------- Berechnung ---------- */
function areaPct(areaId, vals){
  const ms = config.metrics.filter(m=>m.area===areaId);
  if(!ms.length) return 0;
  let s=0; ms.forEach(m=>{ s += Math.min(1, m.goal>0 ? (vals[m.id]||0)/m.goal : 0); });
  return s/ms.length;
}
function totalPct(vals){
  const ms = config.metrics;
  if(!ms.length) return 0;
  let s=0; ms.forEach(m=>{ s += Math.min(1, m.goal>0 ? (vals[m.id]||0)/m.goal : 0); });
  return s/ms.length;
}

/* ---------- Ring ---------- */
function ring(p, size, sw, small){
  const r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-Math.min(1,p));
  const col = p>=1 ? "var(--good)" : "var(--accent)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p*100)} Prozent">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    ${small?"":`<text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central"
      font-family="Archivo, sans-serif" font-weight="800" font-size="${size*0.24}" fill="var(--ink)">${Math.round(p*100)}%</text>`}
  </svg>`;
}

/* ---------- Woche ---------- */
const elWeek = document.getElementById("view-week");
function renderWeek(){
  const key = keyOf(curMon); loadWeek(key);
  const vals = valuesOf(key), notes = notesOf(key), kw = isoOf(curMon).week;
  const parts = config.areas.map(a=>{
    const ms = config.metrics.filter(m=>m.area===a.id);
    if(!ms.length) return "";
    const done = ms.filter(m=>m.goal>0 && (vals[m.id]||0)>=m.goal).length;
    const rows = ms.map(m=>{
      const v = vals[m.id]||0;
      const p = m.goal>0 ? Math.min(1, v/m.goal) : 0;
      const isDone = m.goal>0 && v>=m.goal;
      const note = notes[m.id] || "";
      const open = openNotes.has(m.id);
      return `<div class="metric${isDone?" done":""}" data-m="${m.id}">
        <div class="m-top">
          <span class="m-name"><span class="n">${esc(m.name)}</span>${m.hint?`<span class="h">${esc(m.hint)}</span>`:""}</span>
          <span class="stepper">
            <button class="step minus" data-act="dec" data-m="${m.id}" ${v<=0?"disabled":""} aria-label="${esc(m.name)} verringern">−</button>
            <input class="val" data-m="${m.id}" inputmode="decimal" value="${fmt(v,m.unit)}" aria-label="${esc(m.name)} Wert">
            <button class="step" data-act="inc" data-m="${m.id}" aria-label="${esc(m.name)} erhöhen">+</button>
            <button class="notebtn${note?" has":""}" data-act="note" data-m="${m.id}" aria-expanded="${open}" aria-label="Notiz zu ${esc(m.name)}">
              <svg viewBox="0 0 24 24" fill="${note?"currentColor":"none"}" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-4.9A8.3 8.3 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
            </button>
          </span>
        </div>
        <div class="m-bar">
          <span class="track"><span class="fill" style="width:${(p*100).toFixed(1)}%"></span></span>
          <span class="goal">Ziel <b>${fmt(m.goal,m.unit)}</b></span>
        </div>
        <div class="notepanel" data-note="${m.id}" ${open?"":"hidden"}>
          <textarea class="noteinput" data-m="${m.id}" rows="3" placeholder="Notiz zu „${esc(m.name)}“ in KW ${kw}">${esc(note)}</textarea>
        </div>
      </div>`;
    }).join("");
    return `<div class="area"><div class="area-head"><h2>${esc(a.name)}</h2>
      <span class="area-score">${ring(areaPct(a.id,vals),30,4,true)}<b>${done}/${ms.length}</b> erreicht</span>
    </div>${rows}</div>`;
  }).join("");
  elWeek.innerHTML = `<div class="areas">${parts}</div>`;
}

/* ---------- Fortschritt ---------- */
const elProg = document.getElementById("view-progress");
function renderProgress(){
  const key = keyOf(curMon); loadWeek(key);
  const vals = valuesOf(key);
  const tp = totalPct(vals);
  const all = config.metrics.length;
  const done = config.metrics.filter(m=>m.goal>0 && (vals[m.id]||0)>=m.goal).length;
  const cards = config.areas.map(a=>{
    const ms = config.metrics.filter(m=>m.area===a.id);
    if(!ms.length) return "";
    const d = ms.filter(m=>m.goal>0 && (vals[m.id]||0)>=m.goal).length;
    return `<div class="ringcard">${ring(areaPct(a.id,vals),74,7)}<span class="nm">${esc(a.name)}</span><span class="dt">${d} von ${ms.length} Zielen</span></div>`;
  }).join("");
  const rows = config.metrics.map(m=>{
    const v = vals[m.id]||0, rest = Math.max(0,(m.goal||0)-v);
    return {m, rest, ok: m.goal>0 && v>=m.goal};
  }).sort((x,y)=> (x.ok===y.ok) ? y.rest-x.rest : (x.ok?1:-1))
    .map(o=>`<div class="openrow${o.ok?" ok":""}"><span class="dot"></span><span>${esc(o.m.name)}</span>
      <span class="rest">${o.ok?"erreicht":"noch "+fmt(round2(o.rest),o.m.unit)}</span></div>`).join("");
  const line = tp>=1 ? "Alle Ziele dieser Woche stehen."
    : (done>0 ? `${done} von ${all} Kennzahlen sind im Ziel — ${all-done} noch offen.`
              : "Noch nichts im Ziel. Die erste Zahl ist die schwerste.");
  elProg.innerHTML = `<div class="hero"><span class="cap">Zielerreichung KW ${isoOf(curMon).week}</span>${ring(tp,168,13)}<span class="sub">${line}</span></div>
    <div class="ringgrid">${cards}</div>
    <div class="openlist"><h3>Kennzahlen dieser Woche</h3>${rows}</div>`;
}

/* ---------- Verlauf ---------- */
const elHist = document.getElementById("view-history");
const SERIES_COLORS = ["--s1","--s2","--s3","--s4","--s5"];
function weekKeysForRange(){
  const end = todayMonday();
  let start;
  if(hRange===0){
    start = mondayOf(end.getUTCFullYear(),1);
    if(start > end) start = mondayOf(end.getUTCFullYear()-1,1);
  } else {
    start = new Date(end);
    start.setUTCMonth(start.getUTCMonth()-hRange);
    start.setUTCDate(start.getUTCDate()-((start.getUTCDay()+6)%7));
  }
  const keys=[]; let d=new Date(start);
  while(d<=end){ keys.push({key:keyOf(d), mon:new Date(d)}); d=shiftWeek(d,1); }
  return keys;
}
function seriesLabel(id){
  if(id==="__total") return "Gesamt";
  const m = config.metrics.find(x=>x.id===id); return m ? m.name : id;
}
function renderHistory(){
  const chips = [{id:"__total",label:"Gesamt"}].concat(config.metrics.map(m=>({id:m.id,label:m.name})));
  const chipHtml = chips.map(c=>{
    const i = hSeries.indexOf(c.id), on = i>=0;
    return `<button class="chip" data-series="${c.id}" aria-pressed="${on}">${on?`<i class="sw" style="background:var(${SERIES_COLORS[i%5]})"></i>`:""}${esc(c.label)}</button>`;
  }).join("");
  const rangeHtml = [{v:3,l:"3 Monate"},{v:6,l:"6 Monate"},{v:12,l:"12 Monate"},{v:0,l:"Laufendes Jahr"}]
    .map(r=>`<button class="chip" data-range="${r.v}" aria-pressed="${hRange===r.v}">${r.l}</button>`).join("");
  elHist.innerHTML = `<div class="panel">
      <div class="filters">${rangeHtml}</div>
      <div class="filters">${chipHtml}</div>
      <div class="chartwrap" id="chartwrap" style="position:relative"></div>
      <div class="legend" id="legend"></div>
    </div>
    <p class="note">Die Linie zeigt je Kalenderwoche, wie viel Prozent des Wochenziels erreicht wurden. „Gesamt“ ist der Durchschnitt über alle Kennzahlen, jede gleich gewichtet.</p>`;
  drawChart();
}
function drawChart(){
  const wrap = document.getElementById("chartwrap"), legend = document.getElementById("legend");
  if(!wrap) return;
  const keys = weekKeysForRange();
  keys.forEach(k=>loadWeek(k.key));
  const firstIdx = keys.findIndex(k=> Object.values(valuesOf(k.key)).some(v=>v>0));
  const pts = firstIdx>=0 ? keys.slice(firstIdx) : [];
  if(!pts.length){
    wrap.innerHTML = `<div class="empty">Noch keine erfassten Wochen in diesem Zeitraum.<br>Sobald du die erste Woche gefüllt hast, entsteht hier deine Kurve.</div>`;
    legend.innerHTML=""; return;
  }
  const data = hSeries.map((sid,i)=>({
    id:sid, label:seriesLabel(sid), color:`var(${SERIES_COLORS[i%5]})`,
    vals: pts.map(p=>{
      const v = valuesOf(p.key);
      if(sid==="__total") return totalPct(v)*100;
      const m = config.metrics.find(x=>x.id===sid);
      if(!m || !(m.goal>0)) return 0;
      return Math.min(1,(v[sid]||0)/m.goal)*100;
    })
  }));
  const W = Math.max(320, wrap.clientWidth||640), H = 260;
  const pad = {t:14,r:16,b:30,l:40}, iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const yMax = Math.ceil(Math.max(100, ...data.flatMap(d=>d.vals))/25)*25;
  const X = i => pad.l + (pts.length===1 ? iw/2 : iw*i/(pts.length-1));
  const Y = v => pad.t + ih - ih*(v/yMax);
  const ticks=[]; for(let v=0; v<=yMax; v+=(yMax>200?50:25)) ticks.push(v);
  const grid = ticks.map(v=>`<line x1="${pad.l}" y1="${Y(v).toFixed(1)}" x2="${W-pad.r}" y2="${Y(v).toFixed(1)}" stroke="${v===100?"var(--axis)":"var(--grid)"}" stroke-width="1" ${v===100?'stroke-dasharray="4 4"':""}/>
    <text x="${pad.l-8}" y="${Y(v).toFixed(1)}" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}%</text>`).join("");
  const every = Math.max(1, Math.ceil(pts.length/8));
  const xlabels = pts.map((p,i)=> (i%every===0||i===pts.length-1)
    ? `<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${isoOf(p.mon).week}</text>` : "").join("");
  const lines = data.map(d=>{
    const path = d.vals.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const last = d.vals.length-1;
    return `<path d="${path}" fill="none" stroke="${d.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(last).toFixed(1)}" cy="${Y(d.vals[last]).toFixed(1)}" r="4.5" fill="${d.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }).join("");
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" id="chartsvg" style="display:block; touch-action:pan-y">
    ${grid}<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ih}" stroke="var(--axis)" stroke-width="1"/>
    ${xlabels}<g id="cross" style="opacity:0"><line y1="${pad.t}" y2="${pad.t+ih}" stroke="var(--axis)" stroke-width="1"/></g>
    ${lines}<g id="hoverdots"></g></svg>
    <div class="tip" id="tip"></div>
    <div style="text-align:center; font-size:10.5px; color:var(--muted); padding:2px 0 4px">Kalenderwoche</div>`;
  legend.innerHTML = data.map(d=>`<span><i style="background:${d.color}"></i>${esc(d.label)}</span>`).join("");

  const svg = document.getElementById("chartsvg"), tip = document.getElementById("tip");
  const cross = document.getElementById("cross"), dots = document.getElementById("hoverdots");
  function onMove(ev){
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX-r.left)/r.width*W;
    let idx = pts.length===1 ? 0 : Math.round((px-pad.l)/iw*(pts.length-1));
    idx = Math.max(0, Math.min(pts.length-1, idx));
    const cx = X(idx);
    cross.style.opacity=1;
    cross.firstElementChild.setAttribute("x1", cx.toFixed(1));
    cross.firstElementChild.setAttribute("x2", cx.toFixed(1));
    dots.innerHTML = data.map(d=>`<circle cx="${cx.toFixed(1)}" cy="${Y(d.vals[idx]).toFixed(1)}" r="4" fill="${d.color}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    const wv = valuesOf(pts[idx].key);
    tip.innerHTML = `<div class="tw">KW ${isoOf(pts[idx].mon).week} · ${rangeLabel(pts[idx].mon)}</div>` + data.map(d=>{
      let extra="";
      if(d.id!=="__total"){ const m=config.metrics.find(x=>x.id===d.id); if(m) extra=` <span style="color:var(--ink-3)">(${fmt(wv[d.id]||0,m.unit)})</span>`; }
      return `<div class="tr"><i style="background:${d.color}"></i>${esc(d.label)}${extra}<b>${Math.round(d.vals[idx])}%</b></div>`;
    }).join("");
    tip.style.opacity=1;
    const wr = wrap.getBoundingClientRect();
    tip.style.left = ((cx/W)>0.5) ? "10px" : Math.max(10, wr.width-tip.offsetWidth-10)+"px";
    tip.style.top = "4px";
  }
  svg.addEventListener("pointermove", onMove);
  svg.addEventListener("pointerdown", onMove);
  svg.addEventListener("pointerleave", ()=>{ tip.style.opacity=0; cross.style.opacity=0; dots.innerHTML=""; });
}

      </div>
    </div>
    <p class="note"><b>Wo liegen meine Zahlen?</b> Ausschließlich in diesem Browser, auf diesem Gerät — sie werden nirgendwohin übertragen und niemand sonst kann sie sehen. Das heißt aber auch: Handy und Rechner führen getrennte Stände, und wer den Browserverlauf mitsamt Websitedaten löscht, löscht die Zahlen mit. Lade dir deshalb ab und zu eine Sicherung herunter — damit ziehst du deine Daten auch auf ein neues Gerät um.</p>
    <p class="note">Kennzahlen und Bereiche sind vorgegeben; du stellst deine eigenen Wochenziele und Schrittweiten ein. Eigene Kennzahlen kannst du unten in jedem Bereich ergänzen — sie bleiben auch bei einer neuen Programmversion erhalten. Version ${APP_VERSION}.</p>`;
}

setbody.addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]");
  if(!b) return;
  const act = b.dataset.act;
  if(act==="add"){
    custom.push({id:"c_"+Math.random().toString(36).slice(2,9), area:b.dataset.a, name:"Neue Kennzahl", hint:"", goal:1, unit:"n", step:1});
    persistConfig(); renderSettings();
  } else if(act==="del"){
    custom = custom.filter(c=>c.id!==b.dataset.m);
    hSeries = hSeries.filter(s=>s!==b.dataset.m); if(!hSeries.length) hSeries=["__total"];
    persistConfig(); renderSettings();
  } else if(act==="export"){ exportData(); }
  else if(act==="import"){ document.getElementById("importfile").click(); }
});
setbody.addEventListener("change", e=>{
  const f = e.target.dataset.f; if(!f) return;
  const mid = e.target.dataset.m;
  const std = STANDARD.metrics.some(m=>m.id===mid);
  if(std){
    const o = overrides[mid] || (overrides[mid] = {});
    if(f==="goal") o.goal = Math.max(0, parseNum(e.target.value));
    if(f==="step") o.step = Math.max(0.01, parseNum(e.target.value)||1);
  } else {
    const c = custom.find(x=>x.id===mid); if(!c) return;
    if(f==="name") c.name = e.target.value.trim()||"Kennzahl";
    if(f==="goal") c.goal = Math.max(0, parseNum(e.target.value));
    if(f==="step") c.step = Math.max(0.01, parseNum(e.target.value)||1);
    if(f==="unit") c.unit = e.target.value;
  }
  persistConfig(); renderSettings(); renderCurrent();
});

/* ---------- Sicherung ---------- */
function exportData(){
  const weeks = {};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("kpi.week.")===0){
        const w = lsGet(k, null);
        if(w && ((w.values && Object.keys(w.values).length) || (w.notes && Object.keys(w.notes).length))){
          weeks[k.slice("kpi.week.".length)] = {values:w.values||{}, notes:w.notes||{}};
        }
      }
    }
  }catch(e){}
  const payload = {app:"kpi-karte", format:1, exportedAt:new Date().toISOString(), overrides, custom, weeks};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  a.href = url;
  a.download = `kpi-karte-sicherung-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  showBadge("Sicherung erstellt", false);
}
document.getElementById("importfile").addEventListener("change", e=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let d = null;
    try{ d = JSON.parse(reader.result); }catch(err){}
    if(!d || d.app!=="kpi-karte" || !d.weeks){ showBadge("Datei nicht lesbar", true); e.target.value=""; return; }
    const n = Object.keys(d.weeks).length;
    if(!confirm(`Sicherung vom ${new Date(d.exportedAt||Date.now()).toLocaleDateString("de-DE")} mit ${n} Woche(n) einlesen?\n\nBereits vorhandene Wochen mit gleicher Kalenderwoche werden dabei überschrieben.`)){ e.target.value=""; return; }
    Object.keys(d.weeks).forEach(k=>{
      const w = d.weeks[k] || {};
      const rec = {values:w.values||{}, notes:w.notes||{}, updatedAt:new Date().toISOString()};
      weekCache.set(k, rec); lsSet(K.week(k), rec);
    });
    if(d.overrides && typeof d.overrides==="object"){ overrides = Object.assign({}, overrides, d.overrides); }
    if(Array.isArray(d.custom)){
      d.custom.forEach(c=>{ if(c && c.id && !custom.some(x=>x.id===c.id)) custom.push(c); });
    }
    persistConfig();
    e.target.value="";
    renderSettings(); renderCurrent();
    showBadge(n+" Woche(n) eingelesen", false);
  };
  reader.readAsText(file);
});

/* ---------- Ereignisse Wochenansicht ---------- */
elWeek.addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]");
  if(!b) return;
  const m = config.metrics.find(x=>x.id===b.dataset.m);
  if(!m) return;
  if(b.dataset.act==="note"){
    const panel = elWeek.querySelector('.notepanel[data-note="'+m.id+'"]');
    if(!panel) return;
    const willOpen = panel.hidden;
    panel.hidden = !willOpen;
    b.setAttribute("aria-expanded", String(willOpen));
    if(willOpen){ openNotes.add(m.id); const ta = panel.querySelector("textarea"); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
    else openNotes.delete(m.id);
    return;
  }
  const st = m.step>0 ? m.step : 1;
  const cur = getVal(m.id);
  setVal(m.id, b.dataset.act==="inc" ? cur+st : Math.max(0, cur-st));
  renderWeek();
});
elWeek.addEventListener("change", e=>{
  const inp = e.target.closest("input.val");
  if(!inp) return;
  setVal(inp.dataset.m, parseNum(inp.value));
  renderWeek();
});
elWeek.addEventListener("input", e=>{
  const ta = e.target.closest("textarea.noteinput");
  if(!ta) return;
  setNote(ta.dataset.m, ta.value);
  const btn = elWeek.querySelector('button[data-act="note"][data-m="'+ta.dataset.m+'"]');
  if(btn){
    const has = !!ta.value.trim();
    btn.classList.toggle("has", has);
    const svg = btn.querySelector("svg");
    if(svg) svg.setAttribute("fill", has ? "currentColor" : "none");
  }
});
elWeek.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.closest("input.val")) e.target.blur();
  if(e.key==="Escape" && e.target.closest("textarea.noteinput")) e.target.blur();
});

elHist.addEventListener("click", e=>{
  const s = e.target.closest("[data-series]");
  if(s){
    const id = s.dataset.series, i = hSeries.indexOf(id);
    if(i>=0){ if(hSeries.length>1) hSeries.splice(i,1); }
    else { if(hSeries.length>=5) hSeries.shift(); hSeries.push(id); }
    renderHistory(); return;
  }
  const r = e.target.closest("[data-range]");
  if(r){ hRange = Number(r.dataset.range); renderHistory(); }
});

/* ---------- Navigation ---------- */
document.getElementById("prevw").addEventListener("click", ()=>{ curMon = shiftWeek(curMon,-1); renderCurrent(); });
document.getElementById("nextw").addEventListener("click", ()=>{ curMon = shiftWeek(curMon, 1); renderCurrent(); });
document.getElementById("gotoday").addEventListener("click", ()=>{ curMon = todayMonday(); renderCurrent(); });
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
  if(!document.getElementById("sheet").hidden) return;
  if(e.key==="ArrowLeft"){ curMon = shiftWeek(curMon,-1); renderCurrent(); }
  if(e.key==="ArrowRight"){ curMon = shiftWeek(curMon,1); renderCurrent(); }
});
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    view = t.dataset.view;
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x===t)));
    document.getElementById("view-week").hidden = view!=="week";
    document.getElementById("view-progress").hidden = view!=="progress";
    document.getElementById("view-history").hidden = view!=="history";
    renderCurrent();
  });
});
document.getElementById("openset").addEventListener("click", ()=>{
  renderSettings();
  document.getElementById("sheet").hidden = false;
  document.body.style.overflow = "hidden";
});
document.getElementById("closeset").addEventListener("click", ()=>{
  document.getElementById("sheet").hidden = true;
  document.body.style.overflow = "";
  renderCurrent();
});
let rz=null;
window.addEventListener("resize", ()=>{ if(view!=="history") return; clearTimeout(rz); rz=setTimeout(drawChart,160); });
window.addEventListener("error", ()=> showBadge("Fehler – bitte Seite neu laden", true));

/* ---------- Start ---------- */
function renderCurrent(){
  const {week} = isoOf(curMon);
  document.getElementById("kwlabel").textContent = "KW "+week;
  document.getElementById("kwrange").textContent = rangeLabel(curMon);
  document.getElementById("gotoday").hidden = (keyOf(curMon)===keyOf(todayMonday()));
  if(view==="week") renderWeek();
  else if(view==="progress") renderProgress();
  else renderHistory();
}
(function checkVersion(){
  const seen = lsGet(K.cfgv, null);
  if(seen===null){ lsSet(K.cfgv, CONFIG_VERSION); return; }
  if(seen < CONFIG_VERSION){
    lsSet(K.cfgv, CONFIG_VERSION);
    const box = document.getElementById("updnote");
    box.innerHTML = "<span>✓</span><span><b>Programm aktualisiert.</b> Die Kennzahlenliste wurde erneuert. Deine erfassten Zahlen, Notizen und Ziele sind unverändert.</span>";
    box.hidden = false;
    setTimeout(()=>{ box.hidden = true; }, 30000);
  }
})();
document.getElementById("storemode").textContent = "auf diesem Gerät";
renderCurrent();

})();
</script>
